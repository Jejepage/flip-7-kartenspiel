<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flip 7</title>
  <style>
    :root { color-scheme: light; --ink: #f7f1dd; --surface: #173d34; --page: #0b211c; --accent: #edb342; --accent-dark: #7a3e17; --line: #d8c28a; --warm: #fff7df; --focus: #fff; }
    * { box-sizing: border-box; }
    body { font-family: ui-rounded, system-ui, sans-serif; margin: 0; min-width: 0; background: radial-gradient(circle at 50% 20%, #245747, var(--page) 68%); color: var(--ink); line-height: 1.5; }
    main { width: min(100%, 70rem); min-height: 100vh; margin: 0 auto; padding: clamp(.75rem, 4vw, 2rem); overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    h2 { margin-top: 0; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    .panel { background: linear-gradient(135deg, #1b493d, var(--surface)); border: 2px solid #bb9851; border-radius: 1rem; padding: clamp(1rem, 4vw, 1.5rem); box-shadow: 0 .35rem 0 #07130f, inset 0 0 0 1px #ffffff21; }
    .players, .cards { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; list-style: none; }
    .players li { border: 1px solid #d8c28a88; border-radius: 999px; padding: .35rem .7rem; background: #09251e; }
    .card { display:grid; place-items:center; min-width: 3.4rem; min-height: 4.6rem; border: 3px double #6c3516; border-radius: .55rem; padding: .35rem; color: #301b12; text-align: center; font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #fffdf1, var(--warm)); box-shadow: .16rem .18rem 0 #0005; }
    label, input, select, button { display: block; font: inherit; }
    label { margin-top: .9rem; font-weight: 650; }
    input, select { width: 100%; min-height: 2.75rem; padding: .5rem; border: 2px solid var(--line); border-radius: .35rem; background: #fffdf1; color: #17251f; }
    button { min-height: 2.75rem; margin-top: 1rem; padding: .6rem 1rem; border: 2px solid #5d2c13; border-radius: .45rem; background: linear-gradient(#f6c85d, var(--accent)); color: #21150d; font-weight: 800; cursor: pointer; box-shadow: 0 .16rem 0 #55270f; }
    button + button { margin-left: .5rem; }
    button.secondary { background: #f7f1dd; color: #273b32; }
    button:hover { filter: brightness(1.08); }
    button.secondary:hover { background: #fff; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [data-focus]:focus { outline: 4px solid var(--focus); outline-offset: 3px; }
    .status { min-height: 1.5rem; padding: .5rem .75rem; border-left: 4px solid var(--accent); background: #071b15; font-weight: 700; }
    details { margin: 1rem 0; border: 1px solid #d8c28a; border-radius: .5rem; background: #102f27; padding: .5rem .75rem; }
    summary { cursor: pointer; font-weight: 700; }
    @media (max-width: 360px) { main { padding: .75rem; } .panel { border-radius: .5rem; } button { width: 100%; } button + button { margin-left: 0; } .players li, .card { max-width: 100%; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
/* GAME_ENGINE_START */
const GameEngine = (() => {
  function buildDeck() {
    // Vereinfachte, nicht-offizielle Annäherung: Zahl n erscheint n + 1 Mal.
    const deck = [];
    for (let value = 0; value <= 12; value += 1) {
      for (let copy = 0; copy <= value; copy += 1) {
        deck.push({ type: 'number', value });
      }
    }
    // Vereinfachte, nicht-offizielle Ergänzung: jede Sonderkarte einmal pro Stapel.
    [2, 4, 6, 8, 10].forEach((points) => deck.push({ type: 'bonus', points, label: `+${points}` }));
    deck.push({ type: 'action', effect: 'secondChance', label: 'Zweite Chance' });
    deck.push({ type: 'action', effect: 'freeze', label: 'Freeze' });
    return deck;
  }

  function shuffle(deck, random = Math.random) {
    const shuffled = [...deck];
    for (let index = shuffled.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(random() * (index + 1));
      [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
    }
    return shuffled;
  }

  function normalizePlayers(names) {
    const usedNames = new Map();
    return names.map((rawName, index) => {
      const baseName = String(rawName).trim() || `Spieler ${index + 1}`;
      const count = (usedNames.get(baseName) || 0) + 1;
      usedNames.set(baseName, count);
      return { id: `player-${index + 1}`, name: count === 1 ? baseName : `${baseName} ${count}` };
    });
  }

  function startLocalGame(names, random = Math.random) {
    const players = normalizePlayers(names);
    if (players.length < 2 || players.length > 4) {
      throw new Error('Eine lokale Partie benötigt zwei bis vier Personen.');
    }
    return {
      ...createGameState(players),
      phase: 'initialDeal',
      deck: shuffle(buildDeck(), random),
      round: createRoundState(players),
      initialDealCount: 0,
      lastCard: null,
      lastEvent: '',
    };
  }

  function createGameState(players) {
    return {
      players,
      scores: Object.fromEntries(players.map((player) => [player.id, 0])),
      roundStarterIndex: 0,
      activePlayerIndex: 0,
      phase: 'setup',
      winnerId: null,
    };
  }

  function resetLocalGame() {
    return { phase: 'setup', playerCount: 2, names: [] };
  }

  function createRoundState(players) {
    return {
      players: Object.fromEntries(players.map((player) => [player.id, {
        cards: [],
        seenNumbers: [],
        roundPoints: 0,
        busted: false,
        banked: false,
        secondChance: false,
      }])),
    };
  }

  function grantSecondChance(round, playerId) {
    const player = round.players[playerId];
    return { ...round, players: { ...round.players, [playerId]: { ...player, secondChance: true } } };
  }

  function drawNumber(round, playerId, value) {
    const player = round.players[playerId];
    const duplicate = player.seenNumbers.includes(value);
    const protectedDuplicate = duplicate && player.secondChance;
    const nextPlayer = duplicate && !protectedDuplicate
      ? { ...player, busted: true, roundPoints: 0 }
      : protectedDuplicate
        ? { ...player, secondChance: false }
        : {
            ...player,
            seenNumbers: [...player.seenNumbers, value],
            roundPoints: player.roundPoints + value,
          };

    return { ...round, players: { ...round.players, [playerId]: nextPlayer } };
  }

  function hasFlip7(round, playerId) {
    return round.players[playerId].seenNumbers.length === 7;
  }

  function calculateNumberPoints(cards) {
    return cards.reduce((total, card) => total + card.value, 0);
  }

  function bankPoints(game, round, playerId) {
    const player = round.players[playerId];
    return {
      game: {
        ...game,
        scores: { ...game.scores, [playerId]: game.scores[playerId] + player.roundPoints },
      },
      round: {
        ...round,
        players: { ...round.players, [playerId]: { ...player, banked: true } },
      },
    };
  }

  function eligibleFreezeTargets(state) {
    const playerId = activePlayerId(state);
    return state.players.filter((player) => {
      const roundPlayer = state.round.players[player.id];
      return player.id !== playerId && !roundPlayer.banked && !roundPlayer.busted;
    });
  }

  function freezePlayer(state, targetId) {
    const playerId = activePlayerId(state);
    if (state.phase !== 'freezeTarget') throw new Error('Freeze benötigt eine Zielauswahl.');
    const target = state.round.players[targetId];
    if (targetId === playerId || !target) throw new Error('Freeze muss eine andere Person treffen.');
    if (target.banked || target.busted) throw new Error('Freeze kann keine bereits gesicherte oder gebustete Person treffen.');
    const banked = bankPoints(state, state.round, targetId);
    const resolved = {
      ...state,
      ...banked.game,
      round: banked.round,
      phase: state.resumePhase || 'handoff',
      resumePhase: null,
      lastEvent: `${state.players.find((player) => player.id === targetId).name} wurde eingefroren und hat Punkte gesichert.`,
    };
    return resolved.phase === 'initialReveal' ? resolved : advanceAfterPlayer(resolved);
  }

  function activePlayerId(state) {
    return state.players[state.activePlayerIndex].id;
  }

  function handoffStatusMessage(state) {
    const nextPlayer = state.players[state.activePlayerIndex].name;
    const turnChange = `Zugwechsel: ${nextPlayer} ist als Nächstes am Zug.`;
    return state.lastEvent ? `${state.lastEvent} ${turnChange}` : turnChange;
  }

  function showTurn(state) {
    if (state.phase !== 'handoff') throw new Error('Der Zug kann nur vom Übergabebildschirm gezeigt werden.');
    return { ...state, phase: 'turn', lastCard: null, lastEvent: '' };
  }

  function allPlayersFinished(state) {
    return state.players.every((player) => {
      const roundPlayer = state.round.players[player.id];
      return roundPlayer.banked || roundPlayer.busted;
    });
  }

  function nextActivePlayerIndex(state) {
    for (let offset = 1; offset <= state.players.length; offset += 1) {
      const index = (state.activePlayerIndex + offset) % state.players.length;
      const roundPlayer = state.round.players[state.players[index].id];
      if (!roundPlayer.banked && !roundPlayer.busted) return index;
    }
    return state.activePlayerIndex;
  }

  function finishRound(state, event = 'Runde beendet.') {
    let scores = { ...state.scores };
    const players = {};
    state.players.forEach((player) => {
      const roundPlayer = state.round.players[player.id];
      const points = roundPlayer.busted || roundPlayer.banked ? 0 : roundPlayer.roundPoints;
      scores[player.id] += points;
      players[player.id] = { ...roundPlayer, banked: roundPlayer.banked || !roundPlayer.busted };
    });
    const highest = Math.max(...state.players.map((player) => scores[player.id]));
    const leaders = state.players.filter((player) => scores[player.id] === highest);
    const winner = highest >= 200 && leaders.length === 1 ? leaders[0] : null;
    return {
      ...state,
      scores,
      round: { ...state.round, players },
      phase: winner ? 'gameOver' : 'roundResult',
      winnerId: winner ? winner.id : null,
      lastEvent: event,
    };
  }

  function beginNextRound(state, random = Math.random) {
    const roundStarterIndex = (state.roundStarterIndex + 1) % state.players.length;
    return {
      ...state,
      roundStarterIndex,
      activePlayerIndex: roundStarterIndex,
      phase: 'initialDeal',
      deck: shuffle(buildDeck(), random),
      round: createRoundState(state.players),
      initialDealCount: 0,
      lastCard: null,
      lastEvent: 'Neue Runde.',
    };
  }

  function advanceAfterPlayer(state, random = Math.random) {
    if (allPlayersFinished(state)) return finishRound(state);
    return { ...state, activePlayerIndex: nextActivePlayerIndex(state), phase: 'handoff', lastCard: null };
  }

  function continueInitialDeal(state) {
    if (state.phase !== 'initialReveal') throw new Error('Die offene erste Karte muss vor der Übergabe angezeigt werden.');
    const dealt = state.initialDealCount + 1;
    if (dealt >= state.players.length) {
      return { ...state, initialDealCount: dealt, activePlayerIndex: state.roundStarterIndex, phase: 'handoff', lastCard: null };
    }
    return { ...state, initialDealCount: dealt, activePlayerIndex: (state.roundStarterIndex + dealt) % state.players.length, phase: 'initialDeal', lastCard: null };
  }

  function revealCard(state, afterResolution, freezeResumePhase = state.phase) {
    const card = state.deck[0];
    if (!card) throw new Error('Der Stapel ist leer.');
    const playerId = activePlayerId(state);
    const player = state.round.players[playerId];
    const withCard = { ...player, cards: [...player.cards, card] };
    const base = { ...state, deck: state.deck.slice(1), lastCard: card, round: { ...state.round, players: { ...state.round.players, [playerId]: withCard } } };
    if (card.type === 'bonus') {
      const next = { ...base, round: { ...base.round, players: { ...base.round.players, [playerId]: { ...withCard, roundPoints: withCard.roundPoints + card.points } } }, lastEvent: `+${card.points} Rundenpunkte erhalten.` };
      return afterResolution(next);
    }
    if (card.effect === 'secondChance') return afterResolution({ ...base, round: grantSecondChance(base.round, playerId), lastEvent: 'Zweite Chance: Das nächste Zahlen-Duplikat wird neutralisiert.' });
    if (card.effect === 'freeze') {
      if (eligibleFreezeTargets(base).length === 0) return afterResolution({ ...base, lastEvent: 'Freeze ohne Effekt: Es gibt kein gültiges Ziel.' });
      return { ...base, phase: 'freezeTarget', resumePhase: freezeResumePhase, lastEvent: 'Freeze: Wähle eine andere Person, deren Rundenpunkte gesichert werden.' };
    }
    const updatedRound = drawNumber(base.round, playerId, card.value);
    const next = { ...base, round: updatedRound, lastEvent: `Zahl ${card.value} aufgedeckt.` };
    if (hasFlip7(updatedRound, playerId)) {
      const updatedPlayer = updatedRound.players[playerId];
      const withBonus = { ...updatedRound, players: { ...updatedRound.players, [playerId]: { ...updatedPlayer, roundPoints: updatedPlayer.roundPoints + 15 } } };
      return finishRound({ ...next, round: withBonus }, 'Flip 7! 15 Bonuspunkte – Runde beendet.');
    }
    return afterResolution({ ...next, lastEvent: updatedRound.players[playerId].busted ? 'Doppelte Zahl – bust!' : next.lastEvent });
  }

  function dealInitialCard(state) {
    if (state.phase !== 'initialDeal') throw new Error('Die erste Karte kann nur beim Erstausteilen aufgedeckt werden.');
    return revealCard(state, (revealed) => ({ ...revealed, phase: 'initialReveal' }), 'initialReveal');
  }

  function drawActiveCard(state, random = Math.random) {
    if (state.phase !== 'turn') throw new Error('Eine Karte kann nur während eines Zuges aufgedeckt werden.');
    return revealCard(state, advanceAfterPlayer);
  }

  function drawActiveNumber(state, random = Math.random) {
    return drawActiveCard(state, random);
  }

  function bankActivePlayer(state, random = Math.random) {
    if (state.phase !== 'turn') throw new Error('Punkte können nur während eines Zuges gesichert werden.');
    const playerId = activePlayerId(state);
    const banked = bankPoints(state, state.round, playerId);
    const scored = { ...state, ...banked.game, round: banked.round, lastEvent: 'Punkte gesichert.' };
    return advanceAfterPlayer(scored, random);
  }

  return {
    buildDeck, shuffle, normalizePlayers, startLocalGame, createGameState, resetLocalGame, createRoundState,
    drawNumber, grantSecondChance, hasFlip7, calculateNumberPoints, bankPoints, eligibleFreezeTargets, freezePlayer, showTurn, handoffStatusMessage, dealInitialCard, continueInitialDeal, drawActiveCard, drawActiveNumber,
    bankActivePlayer, finishRound, beginNextRound,
  };
})();

if (typeof module !== 'undefined') {
  module.exports = GameEngine;
}
/* GAME_ENGINE_END */
  </script>
  <script>
    (() => {
      const app = document.querySelector('#app');
      let state = { phase: 'setup' };

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
        }[character]));
      }

      function activePlayer() {
        return state.players[state.activePlayerIndex];
      }

      function scoreList() {
        return `<ul class="players">${state.players.map((player) =>
          `<li>${escapeHtml(player.name)}: <strong>${state.scores[player.id]}</strong></li>`).join('')}</ul>`;
      }

      function rules() {
        return `<details><summary>Regeln und Hilfe</summary><p>Jede Runde beginnt mit genau einer offenen Karte pro Person. Danach gibt es im Uhrzeigersinn genau einen Hit oder Stay pro Zug: Hit deckt eine Karte auf und übergibt sofort, Stay sichert ohne Karte und übergibt. Zahlen bringen ihren Wert; ein eigenes Duplikat bustet, außer eine Zweite Chance schützt einmal. +2 bis +10 erhöhen Punkte, Freeze bankt eine andere Person, und sieben unterschiedliche Zahlen beenden sofort die Runde mit 15 Bonuspunkten.</p><p>Geprüfte Ablaufquellen: Happy Piranha, <a href="https://www.happypiranha.com/en/flip-7-game-rules/">Flip 7 Game Rules</a>, und Dized, <a href="https://rules.dized.com/game/2C2Fkh8KR6y6PN6FmZA0rQ">Flip 7 Rules</a>. Diese lokale Annäherung verwendet bewusst nicht-offizielle Deckhäufigkeiten, nur die genannten Sonderkarten und einen vereinfachten 15-Punkte-Flip-7-Bonus.</p></details>`;
      }

      function pageHeader() {
        return `<header class="app-header"><h1>Flip 7</h1>${state.phase === 'setup' ? '' : '<button id="reset-game" class="secondary" type="button">Partie zurücksetzen</button>'}</header>${rules()}`;
      }

      function statusMessage(fallback) {
        return state.lastEvent || fallback;
      }

      function renderSetup() {
        const count = state.playerCount || 2;
        app.innerHTML = `
          ${pageHeader()}
          <section class="panel" aria-labelledby="setup-title">
            <h2 id="setup-title" tabindex="-1" data-focus>Lokale Partie einrichten</h2>
            <p>Für zwei bis vier Personen. Kartenhände bleiben beim Weitergeben verborgen.</p>
            <label for="player-count">Anzahl Personen</label>
            <select id="player-count"><option value="2"${count === 2 ? ' selected' : ''}>2</option><option value="3"${count === 3 ? ' selected' : ''}>3</option><option value="4"${count === 4 ? ' selected' : ''}>4</option></select>
            ${Array.from({ length: count }, (_, index) => `<label for="name-${index}">Name Person ${index + 1}</label><input id="name-${index}" maxlength="30" value="${escapeHtml((state.names || [])[index] || '')}">`).join('')}
            <button id="start-game" type="button">Partie starten</button>
          </section>`;
        document.querySelector('#player-count').addEventListener('change', (event) => {
          state = { phase: 'setup', playerCount: Number(event.target.value), names: currentNames() };
          render(false);
        });
        document.querySelector('#start-game').addEventListener('click', () => {
          state = GameEngine.startLocalGame(currentNames());
          render();
        });
      }

      function currentNames() {
        return Array.from(app.querySelectorAll('input')).map((input) => input.value);
      }

      function renderHandoff() {
        app.innerHTML = `
          ${pageHeader()}${scoreList()}
          <section class="panel" aria-labelledby="handoff-title">
            <h2 id="handoff-title" tabindex="-1" data-focus>Übergabe</h2>
            <p>Bitte gib das Gerät an <strong>${escapeHtml(activePlayer().name)}</strong>.</p>
            <p class="status" role="status" aria-live="polite" aria-atomic="true">${escapeHtml(GameEngine.handoffStatusMessage(state))}</p>
            <button id="show-turn" type="button">Zug anzeigen</button>
          </section>`;
        document.querySelector('#show-turn').addEventListener('click', () => { state = GameEngine.showTurn(state); render(); });
      }

      function renderInitialDeal() {
        const player = activePlayer();
        app.innerHTML = `${pageHeader()}${scoreList()}<section class="panel" aria-labelledby="deal-title"><h2 id="deal-title" tabindex="-1" data-focus>Offene Erstausteilung</h2><p>Gib das Gerät an <strong>${escapeHtml(player.name)}</strong>. Jede Person erhält jetzt genau eine offene Karte.</p><p class="status" role="status" aria-live="polite">${escapeHtml(statusMessage(`${player.name} erhält die erste Karte.`))}</p><button id="deal-initial" type="button">Erste Karte aufdecken</button></section>`;
        document.querySelector('#deal-initial').addEventListener('click', () => { state = GameEngine.dealInitialCard(state); render(); });
      }

      function renderInitialReveal() {
        const player = activePlayer();
        const card = state.lastCard;
        const label = card.label || `Zahlenkarte ${card.value}`;
        app.innerHTML = `${pageHeader()}${scoreList()}<section class="panel" aria-labelledby="reveal-title"><h2 id="reveal-title" tabindex="-1" data-focus>${escapeHtml(player.name)}s erste offene Karte</h2><p class="status" role="status" aria-live="polite" aria-atomic="true">${escapeHtml(statusMessage('Karte aufgedeckt.'))}</p><ul class="cards" aria-label="Aufgedeckte erste Karte von ${escapeHtml(player.name)}"><li class="card" aria-label="${escapeHtml(label)}">${escapeHtml(card.label || card.value)}</li></ul><p>Nur ${escapeHtml(player.name)} hat diese Karte gesehen. Gib das Gerät erst danach weiter.</p><button id="continue-initial-deal" type="button">Karte gesehen – weitergeben</button></section>`;
        document.querySelector('#continue-initial-deal').addEventListener('click', () => { state = GameEngine.continueInitialDeal(state); render(); });
      }

      function renderTurn() {
        const player = activePlayer();
        const roundPlayer = state.round.players[player.id];
        const hasCard = roundPlayer.roundPoints > 0 || state.lastCard;
        app.innerHTML = `
          ${pageHeader()}${scoreList()}
          <section class="panel" aria-labelledby="turn-title">
            <h2 id="turn-title" tabindex="-1" data-focus>${escapeHtml(player.name)} ist am Zug</h2>
            <p>Rundenpunkte: <strong>${roundPlayer.roundPoints}</strong> · Reststapel: ${state.deck.length}</p>
            <p class="status" role="status" aria-live="polite" aria-atomic="true">${escapeHtml(statusMessage(`${player.name} ist am Zug.`))}</p>
            <h3>Deine offenen Zahlen</h3>
            <ul class="cards" aria-label="Offene Karten von ${escapeHtml(player.name)}">${roundPlayer.cards.map((card) => `<li class="card" aria-label="${escapeHtml(card.label || `Zahlenkarte ${card.value}`)}">${escapeHtml(card.label || card.value)}</li>`).join('') || '<li>Noch keine Karte</li>'}</ul>
            <button id="draw-card" type="button">Hit: genau eine Karte</button>
            <button id="bank-points" type="button" class="secondary">Stay: Punkte sichern</button>
          </section>`;
        document.querySelector('#draw-card').addEventListener('click', () => { state = GameEngine.drawActiveCard(state); render(); });
        const bank = document.querySelector('#bank-points');
        if (bank) bank.addEventListener('click', () => { state = GameEngine.bankActivePlayer(state); render(); });
      }

      function renderFreezeTarget() {
        const targets = GameEngine.eligibleFreezeTargets(state);
        const card = state.lastCard;
        app.innerHTML = `
          ${pageHeader()}${scoreList()}
          <section class="panel" aria-labelledby="freeze-title">
            <h2 id="freeze-title" tabindex="-1" data-focus>Freeze-Ziel wählen</h2>
            <p class="status" role="status" aria-live="polite" aria-atomic="true">${escapeHtml(statusMessage('Freeze: Wähle eine Zielperson.'))}</p>
            ${card ? `<ul class="cards" aria-label="Aufgedeckte Karte"><li class="card" aria-label="${escapeHtml(card.label || `Zahlenkarte ${card.value}`)}">${escapeHtml(card.label || card.value)}</li></ul>` : ''}
            <label for="freeze-target">Andere Person, deren aktuelle Rundenpunkte gesichert werden</label>
            <select id="freeze-target">${targets.map((player) => `<option value="${player.id}">${escapeHtml(player.name)} (${state.round.players[player.id].roundPoints} Punkte)</option>`).join('')}</select>
            <button id="confirm-freeze" type="button">Freeze ausführen</button>
          </section>`;
        document.querySelector('#confirm-freeze').addEventListener('click', () => {
          state = GameEngine.freezePlayer(state, document.querySelector('#freeze-target').value);
          render();
        });
      }

      function renderRoundResult() {
        app.innerHTML = `
          ${pageHeader()}${scoreList()}
          <section class="panel" aria-labelledby="round-title">
            <h2 id="round-title" tabindex="-1" data-focus>Rundenergebnis</h2>
            <p class="status" role="status" aria-live="polite" aria-atomic="true">${escapeHtml(statusMessage('Runde beendet.'))}</p>
            <ul class="players">${state.players.map((player) => `<li>${escapeHtml(player.name)}: ${state.round.players[player.id].busted ? 'bust (0)' : `${state.round.players[player.id].roundPoints} Rundenpunkte`}</li>`).join('')}</ul>
            <p>Die nächste Runde beginnt bei ${escapeHtml(state.players[(state.roundStarterIndex + 1) % state.players.length].name)}.</p>
            <button id="next-round" type="button">Nächste Runde</button>
          </section>`;
        document.querySelector('#next-round').addEventListener('click', () => { state = GameEngine.beginNextRound(state); render(); });
      }

      function renderGameOver() {
        const winner = state.players.find((player) => player.id === state.winnerId);
        app.innerHTML = `
          ${pageHeader()}${scoreList()}
          <section class="panel" aria-labelledby="winner-title">
            <h2 id="winner-title" tabindex="-1" data-focus>${escapeHtml(winner.name)} gewinnt!</h2>
            <p>Das Ziel von 200 Punkten ist erreicht.</p>
            <button id="new-game" type="button">Neue Partie</button>
          </section>`;
        document.querySelector('#new-game').addEventListener('click', () => { state = GameEngine.resetLocalGame(); render(); });
      }

      function render(moveFocus = true) {
        if (state.phase === 'setup') renderSetup();
        else if (state.phase === 'initialDeal') renderInitialDeal();
        else if (state.phase === 'initialReveal') renderInitialReveal();
        else if (state.phase === 'handoff') renderHandoff();
        else if (state.phase === 'turn') renderTurn();
        else if (state.phase === 'freezeTarget') renderFreezeTarget();
        else if (state.phase === 'roundResult') renderRoundResult();
        else renderGameOver();

        const reset = document.querySelector('#reset-game');
        if (reset) reset.addEventListener('click', () => { state = GameEngine.resetLocalGame(); render(); });
        if (moveFocus) document.querySelector('[data-focus]')?.focus();
      }

      render();
    })();
  </script>
</body>
</html>
